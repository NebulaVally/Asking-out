<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 🎉</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 450px;
        }
        h1 {
            font-size: 2.5rem;
            color: #2ed573;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.2rem;
            color: #555;
            line-height: 1.6;
        }
        .celebration-emoji {
            font-size: 70px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="celebration-emoji">🥳💖✨</div>
        <h1>You just made my day!</h1>
        <p>I can't wait for everything ahead of us. Let's make it unforgettable!</p>
    </div>

</body>
</html>
