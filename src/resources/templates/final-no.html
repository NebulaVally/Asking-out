<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You ✨</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 90%;
        }
        .emoji {
            font-size: 65px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">🌸✨</div>
        <h1>I Completely Understand</h1>
        <p>Thank you for being direct and honest with me. I appreciate you so much and value our connection regardless. No awkwardness—just good vibes!</p>
    </div>

</body>
</html>
