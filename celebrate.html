<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! 🎉</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 450px;
        }
        h1 { font-size: 2.5rem; color: #2ed573; margin-bottom: 15px; }
        p { font-size: 1.2rem; color: #555; line-height: 1.6; }
        .celebration-emoji { font-size: 70px; margin-bottom: 20px; }

        .heart {
            position: fixed;
            top: -10%;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="celebration-emoji">🥰💕💋</div>
        <h1>Wow, you actually picked me!</h1>
        <p>I'm so happy I could stand up and run, but my social anxiety is too high. Maybe we could fix that together... I can't wait for our future, ma chère🫂.</p>
    </div>

    <script>
       const hearts = ['💖', '❤️', '💕', '✨', '💗', '🌸'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 2 + 's'; // Spawns fast (2-4s duration)
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        // 1. Start spawning a heart every 150ms
        const heartInterval = setInterval(createHeart, 150);

        // 2. Stop spawning new hearts after 4 seconds (4000ms)
        setTimeout(() => {
            clearInterval(heartInterval);
        }, 4000);
    </script>
</body>
</html>
